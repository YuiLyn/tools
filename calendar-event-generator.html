<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日曆事件生成器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>日曆事件生成器</h1>
        <div class="form-group">
            <label for="eventName">事件名稱（必填）：</label>
            <input type="text" id="eventName" placeholder="輸入事件名稱">
        </div>
        <div class="form-group">
            <label for="eventDate">日期（YYYY-MM-DD）：</label>
            <input type="date" id="eventDate">
        </div>
        <div class="form-group">
            <label>時間：</label>
            <select id="startHour">
                <option value="">開始小時</option>
                <script>
                    for (let i = 0; i < 24; i++) {
                        document.write(`<option value="${i}">${i}:00</option>`);
                    }
                </script>
            </select>
            <select id="startMinute">
                <option value="">開始分鐘</option>
                <option value="00">00</option>
                <option value="30">30</option>
            </select>
            至
            <select id="endHour">
                <option value="">結束小時</option>
                <script>
                    for (let i = 0; i < 24; i++) {
                        document.write(`<option value="${i}">${i}:00</option>`);
                    }
                </script>
            </select>
            <select id="endMinute">
                <option value="">結束分鐘</option>
                <option value="00">00</option>
                <option value="30">30</option>
            </select>
        </div>
        <div class="form-group">
            <label for="location">地點（可選）：</label>
            <input type="text" id="location" placeholder="輸入地點">
        </div>
        <div class="form-group">
            <label for="description">描述（可選）：</label>
            <textarea id="description" placeholder="輸入事件描述"></textarea>
        </div>
        <button onclick="generateCalendar()">生成日曆事件</button>
        <button id="downloadBtn" onclick="downloadICS()">下載 .ics 文件</button>
        <div id="qrCode"></div> <!-- 添加 QR 碼顯示區域 -->
        <button class="back-button" onclick="goBack()">返回主頁</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js">
        function goBack() {
            window.location.href = 'index.html'; // 直接跳轉到 index.html
        }
    </script>
</body>
</html>
