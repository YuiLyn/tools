<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片上傳生成鏈接</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #drop-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            width: 80%;
            height: 150px;
            text-align: center;
            line-height: 150px;
            margin: 20px auto;
            cursor: pointer;
        }
        #drop-area.hover {
            border-color: #000;
        }
        #file-input {
            display: none;
        }
        #status {
            margin-top: 20px;
            font-size: 1.2em;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>圖片上傳生成鏈接</h1>
        <div id="drop-area">
            拖拽圖片到這裡或點擊上傳
        </div>
        <input type="file" id="file-input" accept="image/*">
        <div id="status"></div>
        <button onclick="goBack()">返回主頁</button>
    </div>

    <script>
        const dropArea = document.getElementById('drop-area');
        const fileInput = document.getElementById('file-input');
        const statusText = document.getElementById('status');

        // 防止默認行為
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // 高亮拖拽區域
        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.add('hover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => dropArea.classList.remove('hover'), false);
        });

        // 處理文件拖拽
        dropArea.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', handleFiles, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        function handleFiles(files) {
            const file = files[0];
            if (file && file.type.startsWith('image/')) {
                uploadFile(file);
            } else {
                statusText.textContent = '請上傳有效的圖片文件';
            }
        }

        function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.url) {
                    statusText.innerHTML = `圖片鏈接: <a href="${data.url}" target="_blank">${data.url}</a>`;
                } else {
                    statusText.textContent = '上傳失敗';
                }
            })
            .catch(error => {
                statusText.textContent = '上傳出錯';
                console.error('Error:', error);
            });
        }

        // 點擊區域觸發文件選擇
        dropArea.addEventListener('click', () => fileInput.click());

        // 返回主頁
        function goBack() {
            window.location.href = 'index.html'; // 直接跳轉到 index.html
        }
    </script>
</body>
</html>
