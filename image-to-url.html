<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片轉鏈接工具</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #drop-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            width: 300px;
            height: 200px;
            text-align: center;
            line-height: 200px;
            margin: 20px auto;
            cursor: pointer;
        }
        #drop-area.hover {
            border-color: #000;
            background-color: #f0f0f0;
        }
        @media (max-width: 768px) {
            #drop-area {
                width: 250px;
                height: 150px;
                line-height: 150px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>圖片轉鏈接工具</h1>
        <div class="input-group">
            <div id="drop-area">
                拖拽圖片到這裡或點擊上傳
                <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="convertImageToUrl()">
            </div>
        </div>
        <div class="result" id="result"></div>
        <button onclick="copyUrl()" style="display: none;" id="copyButton">複製鏈接</button>
        <button class="back-button" onclick="goBack()">返回主頁</button>
    </div>
    <script>
        let generatedUrl = '';

        // 防止默認行為
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.getElementById('drop-area').addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // 高亮拖拽區域
        ['dragenter', 'dragover'].forEach(eventName => {
            document.getElementById('drop-area').addEventListener(eventName, () => {
                document.getElementById('drop-area').classList.add('hover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            document.getElementById('drop-area').addEventListener(eventName, () => {
                document.getElementById('drop-area').classList.remove('hover');
            }, false);
        });

        // 處理文件拖放
        document.getElementById('drop-area').addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                document.getElementById('fileInput').files = files;
                convertImageToUrl();
            }
        }

        // 點擊觸發文件選擇
        document.getElementById('drop-area').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        function convertImageToUrl() {
            const file = document.getElementById('fileInput').files[0];
            const resultDiv = document.getElementById('result');
            const copyButton = document.getElementById('copyButton');

            if (!file) {
                resultDiv.innerHTML = "請選擇或拖動一個圖片檔案！";
                copyButton.style.display = 'none';
                return;
            }

            if (file.size > 10 * 1024 * 1024) {
                resultDiv.innerHTML = "圖片過大，請選擇小於 10MB 的圖片！";
                copyButton.style.display = 'none';
                return;
            }

            const formData = new FormData();
            formData.append('image', file);

            fetch('https://api.imgur.com/3/image', {
                method: 'POST',
                headers: {
                    Authorization: '9864592e852c006' // 替換為你的 Client ID
                },
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.data.link) {
                    generatedUrl = data.data.link;
                    resultDiv.innerHTML = `
                        <p>圖片已轉換為鏈接！</p>
                        <p>鏈接：<a href="${generatedUrl}" target="_blank">${generatedUrl}</a></p>
                    `;
                    copyButton.style.display = 'block';
                } else {
                    resultDiv.innerHTML = "上傳失敗，請重試！錯誤: " + (data.data ? data.data.error : '未知');
                    copyButton.style.display = 'none';
                }
            })
            .catch(error => {
                resultDiv.innerHTML = "上傳出錯，請重試！";
                console.error('Error:', error);
                copyButton.style.display = 'none';
            });
        }

        function copyUrl() {
            const urlText = generatedUrl;
            navigator.clipboard.writeText(urlText).then(() => {
                alert("鏈接已複製到剪貼簿！");
            }).catch(err => {
                console.error('複製失敗:', err);
                alert("複製失敗，請手動複製鏈接！");
            });
        }

        function goBack() {
            window.location.href = 'index.html'; // 跳轉到主頁
        }
    </script>
</body>
</html>
