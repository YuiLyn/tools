<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公斤-磅轉換器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>公斤-磅轉換器</h1>
        <div class="form-group">
            <label for="weight">重量：</label>
            <input type="number" id="weight" step="0.1" placeholder="例如：70">
            <select id="unit">
                <option value="kg">公斤</option>
                <option value="lb">磅</option>
            </select>
        </div>
        <button onclick="convertWeight()">轉換</button>
        <div id="result"></div>
        <button onclick="downloadResult()" style="margin-top: 10px; background-color: #32cd32;">下載結果</button>
    </div>

    <script src="script.js"></script>
    <script>
        function convertWeight() {
            const weight = parseFloat(document.getElementById('weight').value);
            const unit = document.getElementById('unit').value;

            if (isNaN(weight) || weight <= 0) {
                document.getElementById('result').innerHTML = '請輸入有效的重量！';
                return;
            }

            let result;
            if (unit === 'kg') {
                const pounds = weight * 2.20462; // 1 公斤 = 2.20462 磅
                result = `${weight} 公斤 = ${pounds.toFixed(2)} 磅`;
            } else {
                const kilos = weight / 2.20462; // 1 磅 = 0.453592 公斤
                result = `${weight} 磅 = ${kilos.toFixed(2)} 公斤`;
            }

            document.getElementById('result').innerHTML = result;
        }

        function goBack() {
            window.location.href = 'index.html'; // 直接跳轉到 index.html
        }

        }
    </script>
</body>
</html>
