<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miles 到 Kilometers 轉換器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Miles 到 Kilometers 轉換器</h1>
        <div class="input-group">
            <label for="distance">輸入距離:</label>
            <input type="number" id="distance" step="any" placeholder="例如：10">
            <select id="unit">
                <option value="miles">英里 (Miles)</option>
                <option value="km">公里 (Kilometers)</option>
            </select>
        </div>
        <button onclick="convert()">轉換</button>
        <div class="result" id="result"></div>
        <button class="back-button" onclick="goBack()">返回主頁</button>
    </div>

    <script src="script.js"></script>
    <script>
        function convert() {
            const distance = parseFloat(document.getElementById('distance').value); // 修正為 'distance'
            const unit = document.getElementById('unit').value;

            if (isNaN(distance) || distance <= 0) {
                document.getElementById('result').innerHTML = '請輸入有效的距離！';
                return;
            }

            let result;
            if (unit === 'miles') {
                const kilometers = distance * 1.60934; // 1 英里 = 1.60934 公里
                result = `${distance} 英里 = ${kilometers.toFixed(2)} 公里`;
            } else {
                const miles = distance / 1.60934; // 1 公里 = 0.621371 英里
                result = `${distance} 公里 = ${miles.toFixed(2)} 英里`;
            }

            document.getElementById('result').innerHTML = result;
        }

        function goBack() {
            window.location.href = 'index.html'; // 直接跳轉到 index.html
        }
    </script>
</body>
</html>
