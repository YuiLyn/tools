<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miles 到 Kilometers 轉換器</title>
    <link rel="stylesheet" href="style.css"> <!-- 確保路徑正確 -->
</head>
<body>
    <div class="container">
        <h1>Miles 到 Kilometers 轉換器</h1>
        <div class="input-group">
            <label for="miles">輸入公里數 (Miles):</label>
            <input type="number" id="miles" step="any" placeholder="輸入公里數">
        </div>
        <button onclick="convert()">轉換</button>
        <div class="result" id="result"></div>
        <button class="back-button" onclick="goBack()">返回主頁</button>
    </div>

    <script src="script.js"></script>
    <script>
        function convert() {
            const weight = parseFloat(document.getElementById('weight').value);
            const unit = document.getElementById('unit').value;

            if (isNaN(weight) || weight <= 0) {
                document.getElementById('result').innerHTML = '請輸入有效的重量！';
                return;
            }

            let result;
            if (unit === 'kg') {
                const pounds = weight * 2.20462; // 1 公斤 = 2.20462 磅
                result = `${weight} 公斤 = ${pounds.toFixed(2)} 磅`;
            } else {
                const kilos = weight / 2.20462; // 1 磅 = 0.453592 公斤
                result = `${weight} 磅 = ${kilos.toFixed(2)} 公斤`;
            }

            document.getElementById('result').innerHTML = result;
        }

        function goBack() {
            window.location.href = 'index.html'; // 直接跳轉到 index.html
        }
    </script>
</body>
</html>
